# ============================================================
# HimDungeons 简体中文语言文件
# ============================================================
# 规则：
#   1) 颜色码统一写 &，由 LanguageManager 转 §
#   2) 占位符格式 %name%，参数由代码传入
#   3) 字面百分号请写 %%
#   4) 每个 key 都需在 en_US.yml 中有对应项
#   5) 修改后执行 /dg reload 生效
# ============================================================

# ===== 通用 =====
common:
  player-only: "该命令只能由玩家执行"
  unknown-subcommand: "未知子命令，使用 /%label% help 查看帮助"
  reload-success: "配置已重载"

# ===== 命令 =====
command:
  help:
    header: "&6=== HimDungeons 命令帮助 ==="
    start: "&e/dg start [地牢名] [模式] &f启动地牢，模式: single(默认)/multi/party"
    start-party-confirm: "&e/dg start party confirm &f确认 Party 加入"
    edit: "&e/dg edit [地牢名] &f管理地牢（不带参数打开管理 GUI）"
    leave: "&e/dg leave &f离开当前地牢"
    reload: "&e/dg reload &f重载配置"
    create: "&e/dg create <地牢名> &f创建新地牢目录结构"
    help: "&e/dg help &f显示此帮助"
    blockpos: "&e/dg blockpos <x> <y> <z> &f计算方块在选区内的相对坐标"
    permissions: "&7权限节点: himdungeons.start, himdungeons.admin, himdungeons.leave"

  blockpos:
    no-permission: "你没有权限使用此命令（需要 himdungeons.admin）"
    debug-only: "该命令仅在调试模式下可用"
    usage: "用法: /dg blockpos <x> <y> <z>"
    no-selection: "请先用木镐（创造模式 + OP）选择区域"
    out-of-region: "该方块不在选区内"
    relative: "相对坐标: (%x%, %y%, %z%)"
    invalid-number: "坐标必须为整数"

  create:
    no-permission: "你没有权限创建地牢（需要 himdungeons.admin）"
    usage: "用法: /dg create <地牢名>"
    exists: "地牢 '%dungeon%' 已存在"
    mkdir-fail: "创建地牢目录失败"
    save-fail: "保存 config.yml 失败: %error%"
    success: "地牢 '%dungeon%' 创建成功！"

  start:
    no-permission: "你没有权限启动地牢（需要 himdungeons.start）"
    not-found: "地牢 '%dungeon%' 不存在或配置缺失"
    not-enabled: "地牢 '%dungeon%' 未启用"
    reentering: "重新进入未完成的地牢 %dungeon%"
    enter-denied: "进入地牢被外部否决"
    already-in: "你已在该地牢中"
    generating: "正在生成地牢 '%dungeon%'，请稍候..."
    unknown-mode: "未知模式: %mode%，可用: single, multi, party"

  edit:
    no-permission: "没有权限"
    invalid-category: "无效分类: %section%"

  leave:
    no-permission: "你没有权限离开地牢（需要 himdungeons.leave）"

  reload:
    no-permission: "你没有权限重载配置（需要 himdungeons.admin）"

  multi:
    no-nearby: "未找到附近 3 格内潜行的玩家，以单人模式启动"
    party-joined: "组队加入 %dungeon%，队员: %names%"

  async:
    generate-failed: "地牢生成失败，请查看控制台错误"
    join-success: "已加入地牢 %dungeon%"
    enter-denied: "进入地牢被外部否决"
    world-not-found: "无法获取地牢世界，请手动传送"
    start-failed: "启动地牢失败: %error%"

  test:
    generating: "&e正在生成测试世界..."

  party:
    no-plugin: "Party 插件未安装，无法使用 Party 模式"
    not-allowed: "该地牢不允许 Party 加入"
    invite-sent: "已向队伍成员发送加入邀请，请队员输入 /dg start party confirm 确认加入"
    integration-failed: "Party 功能未正确集成，请检查插件版本"
    no-pending: "没有待确认的 Party 加入请求"
    confirmed: "确认加入地牢 '%dungeon%'，正在生成..."
    no-members: "队伍中没有其他在线成员"

  list:
    no-permission: "你没有权限使用此命令（需要 himdungeons.admin）"
    header: "&6=== 运行中的地牢实例 ==="
    entry: "&e%world% &7| 地牢: &f%dungeon% &7| 玩家: &f%players% &7| 剩余: &f%time%"
    empty: "&7当前没有运行中的地牢实例"

  kick:
    no-permission: "你没有权限使用此命令（需要 himdungeons.admin）"
    usage: "用法: /dg kick <玩家名>"
    not-found: "玩家 %player% 不在任何地牢中"
    success: "&a已将 %player% 踢出地牢"

  forceend:
    no-permission: "你没有权限使用此命令（需要 himdungeons.admin.world）"
    usage: "用法: /dg forceend <世界名>"
    not-found: "世界 %world% 不是运行中的地牢"
    success: "&a已强制结束 %world%"

  reload-one:
    no-permission: "你没有权限使用此命令（需要 himdungeons.admin）"
    usage: "用法: /dg reload <地牢名>"
    not-found: "地牢 %dungeon% 不存在"
    success: "&a已重载地牢 %dungeon% 的配置"

  validate:
    no-permission: "你没有权限使用此命令（需要 himdungeons.admin）"
    usage: "用法: /dg validate <地牢名>"
    not-found: "地牢 %dungeon% 不存在"
    header: "&6=== 校验地牢 %dungeon% ==="
    ok: "&a✓ %room% 完整"
    missing-schem: "&c✗ %room% 缺少原理图"
    missing-door: "&c✗ %room% 缺少门文件"
    orphan-weight: "&e⚠ structureChoose 中的 %room% 找不到对应文件"
    summary: "&7共 %rooms% 个房间，%errors% 个错误，%warnings% 个警告"

  lang:
    no-permission: "你没有权限使用此命令（需要 himdungeons.admin）"
    usage: "用法: /dg lang <语言代码>"
    not-found: "语言 %code% 不存在，可用: %available%"
    success: "&a语言已切换为 %code%"

  setlobby:
    no-permission: "你没有权限使用此命令（需要 himdungeons.admin）"
    usage: "用法: /dg setlobby <地牢名>"
    not-found: "地牢 %dungeon% 不存在"
    success: "&a已将 %dungeon% 的大厅传送点设置为当前位置 (%world%, %x%, %y%, %z%)"
    save-fail: "&c保存失败: %error%"

  leaderboard:
    no-permission: "你没有权限查看排行榜（需要 himdungeons.start）"
    usage: "用法: /dg leaderboard <地牢名>"
    not-found: "地牢 %dungeon% 不存在"
    list-header: "&6=== 有排行榜的地牢 ==="
    list-entry: "&e%dungeon% &7| 通关人数: &f%players%"
    list-empty: "&7当前没有可查看的地牢"

# ===== 地牢生成流程 =====
