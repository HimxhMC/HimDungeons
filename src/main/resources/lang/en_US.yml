# ============================================================
# HimDungeons English Language File
# ============================================================
# Rules:
#   1) Color codes use &; LanguageManager converts to §
#   2) Placeholders use %name%, filled by code
#   3) Literal percent signs must be written as %%
#   4) Every key here must exist in zh_CN.yml
#   5) Run /dg reload after editing
# ============================================================

# ===== Common =====
common:
  player-only: "This command can only be run by a player"
  unknown-subcommand: "Unknown subcommand. Use /%label% help for help"
  reload-success: "Configuration reloaded"

# ===== Commands =====
command:
  help:
    header: "&6=== HimDungeons Command Help ==="
    start: "&e/dg start [dungeon] [mode] &fStart a dungeon. Modes: single(default)/multi/party"
    start-party-confirm: "&e/dg start party confirm &fConfirm a Party join"
    edit: "&e/dg edit [dungeon] &fManage dungeons (opens the admin GUI with no args)"
    leave: "&e/dg leave &fLeave the current dungeon"
    reload: "&e/dg reload &fReload configuration"
    create: "&e/dg create <dungeon> &fCreate a new dungeon directory"
    help: "&e/dg help &fShow this help"
    blockpos: "&e/dg blockpos <x> <y> <z> &fCalculate a block's relative position in the selection"
    permissions: "&7Permission nodes: himdungeons.start, himdungeons.admin, himdungeons.leave"

  blockpos:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    debug-only: "This command is only available in debug mode"
    usage: "Usage: /dg blockpos <x> <y> <z>"
    no-selection: "Select a region with a wooden pickaxe first (Creative + OP)"
    out-of-region: "That block is outside the selection"
    relative: "Relative position: (%x%, %y%, %z%)"
    invalid-number: "Coordinates must be integers"

  create:
    no-permission: "You do not have permission to create dungeons (requires himdungeons.admin)"
    usage: "Usage: /dg create <dungeon>"
    exists: "Dungeon '%dungeon%' already exists"
    mkdir-fail: "Failed to create the dungeon directory"
    save-fail: "Failed to save config.yml: %error%"
    success: "Dungeon '%dungeon%' created successfully!"

  start:
    no-permission: "You do not have permission to start dungeons (requires himdungeons.start)"
    not-found: "Dungeon '%dungeon%' does not exist or its config is missing"
    not-enabled: "Dungeon '%dungeon%' is not enabled"
    reentering: "Re-entering unfinished dungeon %dungeon%"
    enter-denied: "Entry into the dungeon was denied by an external hook"
    already-in: "You are already in this dungeon"
    generating: "Generating dungeon '%dungeon%', please wait..."
    unknown-mode: "Unknown mode: %mode%. Available: single, multi, party"

  edit:
    no-permission: "No permission"
    invalid-category: "Invalid category: %section%"

  leave:
    no-permission: "You do not have permission to leave dungeons (requires himdungeons.leave)"

  reload:
    no-permission: "You do not have permission to reload configuration (requires himdungeons.admin)"

  multi:
    no-nearby: "No sneaking players found within 3 blocks. Starting in single mode"
    party-joined: "Joining %dungeon% as a group. Members: %names%"

  async:
    generate-failed: "Dungeon generation failed. Check the console for errors"
    join-success: "Joined dungeon %dungeon%"
    enter-denied: "Entry into the dungeon was denied by an external hook"
    world-not-found: "Could not obtain the dungeon world. Please teleport manually"
    start-failed: "Failed to start the dungeon: %error%"

  test:
    generating: "&eGenerating test world..."

  party:
    no-plugin: "Parties is not installed. The Party mode is unavailable"
    not-allowed: "This dungeon does not allow Party joins"
    invite-sent: "Invitations sent to party members. They must run /dg start party confirm to join"
    integration-failed: "Parties integration is not working correctly. Please check the plugin version"
    no-pending: "No pending Party join request"
    confirmed: "Confirmed join for dungeon '%dungeon%'. Generating..."
    no-members: "No other online party members"

  list:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    header: "&6=== Running Dungeon Instances ==="
    entry: "&e%world% &7| Dungeon: &f%dungeon% &7| Players: &f%players% &7| Remaining: &f%time%"
    empty: "&7No dungeon instances are currently running"

  kick:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    usage: "Usage: /dg kick <player>"
    not-found: "Player %player% is not in any dungeon"
    success: "&aKicked %player% from the dungeon"

  forceend:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin.world)"
    usage: "Usage: /dg forceend <world>"
    not-found: "World %world% is not a running dungeon"
    success: "&aForce-ended %world%"

  reload-one:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    usage: "Usage: /dg reload <dungeon>"
    not-found: "Dungeon %dungeon% does not exist"
    success: "&aReloaded config for dungeon %dungeon%"

  validate:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    usage: "Usage: /dg validate <dungeon>"
    not-found: "Dungeon %dungeon% does not exist"
    header: "&6=== Validating Dungeon %dungeon% ==="
    ok: "&a✓ %room% OK"
    missing-schem: "&c✗ %room% missing schematic"
    missing-door: "&c✗ %room% missing door file"
    orphan-weight: "&e⚠ %room% in structureChoose has no matching files"
    summary: "&7Total %rooms% rooms, %errors% errors, %warnings% warnings"

  lang:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    usage: "Usage: /dg lang <code>"
    not-found: "Language %code% does not exist. Available: %available%"
    success: "&aLanguage switched to %code%"

  setlobby:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    usage: "Usage: /dg setlobby <dungeon>"
    not-found: "Dungeon %dungeon% does not exist"
    success: "&aSet lobby teleport for %dungeon% to your current position (%world%, %x%, %y%, %z%)"
    save-fail: "&cSave failed: %error%"

  leaderboard:
    no-permission: "You do not have permission to view leaderboards (requires himdungeons.start)"
    usage: "Usage: /dg leaderboard <dungeon>"
    not-found: "Dungeon %dungeon% does not exist"
    list-header: "&6=== Dungeons with Leaderboards ==="
    list-entry: "&e%dungeon% &7| Total players: &f%players%"
    list-empty: "&7No leaderboards available"

