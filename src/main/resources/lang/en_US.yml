# ============================================================
# HimDungeons English (en_US) Language File
# ============================================================
# Rules:
#   1) Always use & for color codes; LanguageManager converts to §
#   2) Placeholder format is %name%; arguments are passed by code
#   3) Write literal percent signs as %%
#   4) Every key must have a corresponding entry in zh_CN.yml
#   5) Run /dg reload to apply changes
# ============================================================

# ===== Common =====
common:
  player-only: "This command can only be run by a player"
  unknown-subcommand: "Unknown subcommand. Use /%label% help for help"
  reload-success: "Configuration reloaded"

# ===== Commands =====
command:
  help:
    header: "&6=== HimDungeons Command Help ==="
    start: "&e/dg start [dungeon] [mode] &fStart a dungeon. Modes: single (default)/multi/party"
    start-party-confirm: "&e/dg start party confirm &fConfirm Party join"
    edit: "&e/dg edit [dungeon] &fManage dungeons (open admin GUI with no args)"
    leave: "&e/dg leave &fLeave the current dungeon"
    reload: "&e/dg reload &fReload configuration"
    create: "&e/dg create <dungeon> &fCreate a new dungeon directory structure"
    help: "&e/dg help &fShow this help"
    blockpos: "&e/dg blockpos <x> <y> <z> &fCalculate a block's relative coordinates within the selection"
    permissions: "&7Permission nodes: himdungeons.start, himdungeons.admin, himdungeons.leave"

  blockpos:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    debug-only: "This command is only available in debug mode"
    usage: "Usage: /dg blockpos <x> <y> <z>"
    no-selection: "Please select a region with a wooden pickaxe first (creative mode + OP)"
    out-of-region: "That block is not inside the selection"
    relative: "Relative coordinates: (%x%, %y%, %z%)"
    invalid-number: "Coordinates must be integers"

  create:
    no-permission: "You do not have permission to create dungeons (requires himdungeons.admin)"
    usage: "Usage: /dg create <dungeon>"
    exists: "Dungeon '%dungeon%' already exists"
    mkdir-fail: "Failed to create dungeon directory"
    save-fail: "Failed to save config.yml: %error%"
    success: "Dungeon '%dungeon%' created successfully!"

  start:
    no-permission: "You do not have permission to start dungeons (requires himdungeons.start)"
    not-found: "Dungeon '%dungeon%' does not exist or its configuration is missing"
    not-enabled: "Dungeon '%dungeon%' is not enabled"
    reentering: "Re-entering unfinished dungeon %dungeon%"
    enter-denied: "Dungeon entry was externally vetoed"
    already-in: "You are already in this dungeon"
    generating: "Generating dungeon '%dungeon%', please wait..."
    unknown-mode: "Unknown mode: %mode%. Available: single, multi, party"

  edit:
    no-permission: "No permission"
    invalid-category: "Invalid category: %section%"

  leave:
    no-permission: "You do not have permission to leave dungeons (requires himdungeons.leave)"

  reload:
    no-permission: "You do not have permission to reload configuration (requires himdungeons.admin)"

  multi:
    no-nearby: "No nearby sneaking players within 3 blocks found; starting in single mode"
    party-joined: "Joined %dungeon% as a party. Members: %names%"

  async:
    generate-failed: "Dungeon generation failed. Check the console for errors"
    join-success: "Joined dungeon %dungeon%"
    enter-denied: "Dungeon entry was externally vetoed"
    world-not-found: "Could not retrieve the dungeon world; please teleport manually"
    start-failed: "Failed to start dungeon: %error%"

  test:
    generating: "&eGenerating test world..."

  party:
    no-plugin: "Party plugin is not installed; Party mode is unavailable"
    not-allowed: "This dungeon does not allow Party entry"
    invite-sent: "Join invites sent to party members. Members must run /dg start party confirm to join"
    integration-failed: "Party integration failed; check the plugin version"
    no-pending: "No pending Party join request"
    confirmed: "Confirmed join to dungeon '%dungeon%', generating..."
    no-members: "No other online party members"

  list:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    header: "&6=== Running Dungeon Instances ==="
    entry: "&e%world% &7| Dungeon: &f%dungeon% &7| Players: &f%players% &7| Remaining: &f%time%"
    empty: "&7There are no running dungeon instances"

  kick:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    usage: "Usage: /dg kick <player>"
    not-found: "Player %player% is not in any dungeon"
    success: "&aKicked %player% from the dungeon"

  forceend:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin.world)"
    usage: "Usage: /dg forceend <world>"
    not-found: "World %world% is not a running dungeon"
    success: "&aForce-ended %world%"

  reload-one:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    usage: "Usage: /dg reload <dungeon>"
    not-found: "Dungeon %dungeon% does not exist"
    success: "&aReloaded configuration for dungeon %dungeon%"

  validate:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    usage: "Usage: /dg validate <dungeon>"
    not-found: "Dungeon %dungeon% does not exist"
    header: "&6=== Validating Dungeon %dungeon% ==="
    ok: "&a✓ %room% is complete"
    missing-schem: "&c✗ %room% is missing its schematic"
    missing-door: "&c✗ %room% is missing its door file"
    orphan-weight: "&e⚠ %room% in structureChoose has no matching file"
    summary: "&7Total %rooms% rooms, %errors% errors, %warnings% warnings"

  migrate:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    usage: "Usage: /dg migrate <dungeon>"
    not-found: "Dungeon %dungeon% does not exist"
    success: "&aMigrated %dungeon%: %count% rooms converted to single-file format (old files kept)"

  stats:
    usage: "Usage: /dg stats me [dungeon] | /dg stats admin <dungeon> | /dg stats export <dungeon>"
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    not-in-dungeon: "You are not currently in any dungeon; please specify a dungeon name"
    dungeon-required: "Please specify a dungeon name"
    player-header: "&6=== My Stats in %dungeon% ==="
    player-success: "&aClears: &f%n%"
    player-fail: "&cFailures: &f%n%"
    player-rate: "&eWin rate: &f%rate%%%"
    player-fastest: "&eFastest: &f%time%"
    player-average: "&eAverage: &f%time%"
    player-deaths: "&7Total deaths: &f%n%"
    admin-header: "&6=== %dungeon% Server-wide Stats ==="
    admin-runs: "&eRuns: &f%total% &7(success %success% / fail %fail%)"
    admin-fastest: "&eFastest clear: &f%time%"
    admin-average: "&eAverage clear: &f%time%"
    admin-deaths: "&eTotal deaths: &f%n%"
    admin-fail-reasons: "&eFailure reasons: &f%list%"
    export-success: "&aExported %count% records → &f%path%"
    export-fail: "&cExport failed: %error%"
  lang:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    usage: "Usage: /dg lang <language code>"
    not-found: "Language %code% does not exist. Available: %available%"
    success: "&aLanguage switched to %code%"

  setlobby:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    usage: "Usage: /dg setlobby <dungeon>"
    not-found: "Dungeon %dungeon% does not exist"
    success: "&aSet the lobby teleport point for %dungeon% to your current position (%world%, %x%, %y%, %z%)"
    save-fail: "&cSave failed: %error%"
  
  leaderboard:
    no-permission: "You do not have permission to view leaderboards (requires himdungeons.start)"
    usage: "Usage: /dg leaderboard <dungeon>"
    not-found: "Dungeon %dungeon% does not exist"
    list-header: "&6=== Dungeons with Leaderboards ==="
    list-entry: "&e%dungeon% &7| Players cleared: &f%players%"
    list-empty: "&7There are no dungeons to view"
  
  instances:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"

  debug:
    no-permission: "You do not have permission to use this command (requires himdungeons.admin)"
    usage: "Usage: /dg debug clear"

